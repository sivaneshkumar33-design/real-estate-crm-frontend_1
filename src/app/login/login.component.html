<div class="login-container">
  <div class="login-card">
    <h1>Real Estate CRM</h1>

    <p class="subtitle">Login to your account</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter email"
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
        />
      </div>

      <div class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? "Logging in..." : "Login" }}
      </button>

      <div class="demo-logins">
        <p class="demo-title">Quick Demo Logins:</p>
        <div class="demo-buttons">
          <button type="button" class="demo-btn" (click)="setCredentials('admin')">Admin (admin&#64;gmail.com)</button>
          <button type="button" class="demo-btn" (click)="setCredentials('sales')">Sales (sales&#64;example.com)</button>
        </div>
      </div>
    </form>
  </div>
</div>
